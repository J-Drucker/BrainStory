<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Neurogram Platform and Algorithm Marketplace Model</title>
  <desc id="desc">Businesslike infographic showing ANT hardware and Neurogram software delivered as a package to clinicians, third-party developers publishing algorithms, clinician-specific algorithm selection, and two revenue paths.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .panel { fill: #ffffff; stroke: #d7dde4; stroke-width: 2; }
      .soft { fill: #eef3f6; stroke: #d7dde4; stroke-width: 2; }
      .hub { fill: #172029; stroke: #a8c94a; stroke-width: 4; }
      .ink { fill: #172029; }
      .muted { fill: #61707d; }
      .line { stroke: #51616f; stroke-width: 3; fill: none; }
      .product { stroke: #51616f; stroke-width: 4; fill: none; }
      .subscription { stroke: #7aa332; stroke-width: 4; fill: none; }
      .market { stroke: #248f98; stroke-width: 4; fill: none; }
      .share { stroke: #248f98; stroke-width: 4; fill: none; stroke-dasharray: 8 8; }
      .platform { stroke: #7aa332; stroke-width: 4; fill: none; stroke-dasharray: 8 8; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #172029; font-size: 24px; font-weight: 700; letter-spacing: 0; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #61707d; font-size: 18px; letter-spacing: 0; }
      .tiny { font-family: Arial, Helvetica, sans-serif; fill: #61707d; font-size: 15px; letter-spacing: 0; }
      .white { fill: #ffffff; }
      .tile { fill: #ffffff; stroke: #d7dde4; stroke-width: 2; }
      .tileA { fill: #ecf6f7; stroke: #248f98; stroke-width: 2; }
      .tileB { fill: #f0f6e4; stroke: #7aa332; stroke-width: 2; }
      .accent { fill: #a8c94a; }
      .teal { fill: #248f98; }
      .shadow { filter: url(#softShadow); }
    </style>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172029" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#51616f"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa332"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#248f98"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect x="52" y="42" width="1496" height="810" rx="8" class="panel"/>

  <text x="88" y="100" class="label" font-size="34">Integrated Neurogram Platform and Algorithm Marketplace Model</text>
  <text x="88" y="132" class="small">A single clinical package supports subscription access and third-party algorithm revenue sharing.</text>

  <g transform="translate(90 180)" class="shadow">
    <rect x="0" y="0" width="330" height="208" rx="8" class="soft"/>
    <text x="24" y="40" class="label">Third-party algorithm</text>
    <text x="24" y="68" class="label">developers</text>
    <g transform="translate(28 96)">
      <circle cx="28" cy="28" r="22" fill="#dfe6ec"/>
      <path d="M8 72 C12 46,44 46,48 72" fill="#ffffff" stroke="#aab5bf" stroke-width="2"/>
      <rect x="76" y="10" width="190" height="36" rx="8" class="tile"/>
      <rect x="76" y="58" width="156" height="36" rx="8" class="tile"/>
      <rect x="246" y="58" width="44" height="36" rx="8" class="tileA"/>
    </g>
  </g>

  <g transform="translate(470 156)" class="shadow">
    <rect x="0" y="0" width="486" height="214" rx="8" fill="#ffffff" stroke="#d7dde4" stroke-width="2"/>
    <text x="28" y="46" class="label">Single clinical package</text>
    <g transform="translate(28 78)">
      <rect x="0" y="0" width="196" height="98" rx="8" class="tileB"/>
      <path d="M32 28 h88 a22 22 0 0 1 0 44 h-88 a22 22 0 0 1 0-44 z" fill="#ffffff" stroke="#7aa332" stroke-width="3"/>
      <circle cx="54" cy="50" r="7" class="accent"/>
      <circle cx="86" cy="50" r="7" class="accent"/>
      <circle cx="118" cy="50" r="7" class="accent"/>
      <text x="24" y="85" class="tiny">ANT hardware</text>
      <rect x="236" y="0" width="196" height="98" rx="8" class="tileA"/>
      <rect x="270" y="20" width="96" height="56" rx="6" fill="#ffffff" stroke="#248f98" stroke-width="3"/>
      <path d="M382 30 l22 18 l-22 18" fill="none" stroke="#248f98" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="258" y="85" class="tiny">Neurogram software</text>
    </g>
  </g>

  <g transform="translate(520 402)" class="shadow">
    <rect x="0" y="0" width="390" height="226" rx="8" class="hub"/>
    <g transform="translate(36 32)">
      <path d="M0 42 L54 8 L144 0 L214 30 L240 92 L212 154 L138 180 L54 162 L8 102 Z" fill="none" stroke="#a8c94a" stroke-width="7" stroke-linejoin="round"/>
      <path d="M54 8 L126 68 L214 30 M126 68 L8 102 M126 68 L212 154 M126 68 L138 180 M126 68 L54 162" fill="none" stroke="#a8c94a" stroke-width="5" stroke-linecap="round"/>
      <circle cx="126" cy="68" r="8" class="accent"/>
      <circle cx="54" cy="8" r="6" class="accent"/>
      <circle cx="214" cy="30" r="6" class="accent"/>
      <circle cx="212" cy="154" r="6" class="accent"/>
    </g>
    <text x="36" y="172" class="white" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="0">NEUROGRAM</text>
    <text x="38" y="204" fill="#dfe9ee" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="0">clinical platform + algorithm marketplace</text>
  </g>

  <g transform="translate(1044 164)" class="shadow">
    <rect x="0" y="0" width="214" height="390" rx="8" class="panel"/>
    <text x="28" y="42" class="label">Clinician A</text>
    <g transform="translate(58 70)">
      <circle cx="50" cy="42" r="30" fill="#dfe6ec"/>
      <path d="M28 38 C38 18,66 18,76 38 C66 30,38 30,28 38 Z" class="ink"/>
      <rect x="18" y="72" width="64" height="98" rx="8" fill="#ffffff" stroke="#aab5bf" stroke-width="2"/>
      <path d="M18 104 h64" stroke="#d7dde4" stroke-width="2"/>
      <path d="M36 86 v66 M64 86 v66" stroke="#d7dde4" stroke-width="2"/>
      <path d="M34 90 C18 118,26 142,42 142" fill="none" stroke="#248f98" stroke-width="3" stroke-linecap="round"/>
      <circle cx="44" cy="142" r="5" class="teal"/>
    </g>
    <text x="28" y="278" class="small">Selected algorithms</text>
    <rect x="28" y="300" width="72" height="34" rx="8" class="tileA"/>
    <rect x="112" y="300" width="72" height="34" rx="8" class="tileA"/>
    <rect x="28" y="346" width="72" height="34" rx="8" class="tile"/>
    <rect x="112" y="346" width="72" height="34" rx="8" class="tileA"/>
  </g>

  <g transform="translate(1292 164)" class="shadow">
    <rect x="0" y="0" width="214" height="390" rx="8" class="panel"/>
    <text x="28" y="42" class="label">Clinician B</text>
    <g transform="translate(58 70)">
      <circle cx="50" cy="42" r="30" fill="#dfe6ec"/>
      <path d="M18 44 C22 18,78 18,82 44 C74 32,26 32,18 44 Z" class="ink"/>
      <rect x="18" y="72" width="64" height="98" rx="8" fill="#ffffff" stroke="#aab5bf" stroke-width="2"/>
      <path d="M18 104 h64" stroke="#d7dde4" stroke-width="2"/>
      <path d="M36 86 v66 M64 86 v66" stroke="#d7dde4" stroke-width="2"/>
      <path d="M66 90 C82 118,74 142,58 142" fill="none" stroke="#7aa332" stroke-width="3" stroke-linecap="round"/>
      <circle cx="56" cy="142" r="5" class="accent"/>
    </g>
    <text x="28" y="278" class="small">Selected algorithms</text>
    <rect x="28" y="300" width="72" height="34" rx="8" class="tileB"/>
    <rect x="112" y="300" width="72" height="34" rx="8" class="tile"/>
    <rect x="28" y="346" width="72" height="34" rx="8" class="tileB"/>
    <rect x="112" y="346" width="72" height="34" rx="8" class="tileB"/>
  </g>

  <g transform="translate(210 470)">
    <rect x="0" y="0" width="70" height="42" rx="8" class="tileA"/>
    <rect x="86" y="0" width="70" height="42" rx="8" class="tileB"/>
    <rect x="172" y="0" width="70" height="42" rx="8" class="tile"/>
    <rect x="258" y="0" width="70" height="42" rx="8" class="tileA"/>
    <text x="20" y="68" class="tiny">Algorithm modules</text>
  </g>

  <path d="M420 284 C470 284,478 270,502 260" class="product" marker-end="url(#arrowGray)"/>
  <text x="420" y="250" class="tiny">software modules</text>
  <path d="M714 370 L714 398" class="product" marker-end="url(#arrowGray)"/>
  <path d="M910 508 C976 508,986 358,1038 358" class="product" marker-end="url(#arrowGray)"/>
  <path d="M910 522 C1024 522,1120 358,1286 358" class="product" marker-end="url(#arrowGray)"/>
  <text x="940" y="310" class="tiny">platform access</text>

  <g transform="translate(88 686)">
    <rect x="0" y="0" width="1424" height="118" rx="8" fill="#ffffff" stroke="#d7dde4" stroke-width="2"/>
    <text x="26" y="38" class="label">Revenue flows</text>
    <path d="M270 36 C398 36,456 36,584 36" class="subscription" marker-end="url(#arrowGreen)"/>
    <text x="300" y="72" class="small">Clinician subscriptions return to company</text>
    <circle cx="240" cy="36" r="12" class="accent"/>
    <circle cx="612" cy="36" r="12" class="accent"/>
    <path d="M768 36 C864 36,908 36,1004 36" class="market" marker-end="url(#arrowTeal)"/>
    <text x="778" y="72" class="small">Algorithm revenue</text>
    <path d="M1030 36 C1116 18,1168 18,1254 36" class="share" marker-end="url(#arrowTeal)"/>
    <text x="1100" y="72" class="small">developer share</text>
    <path d="M1030 36 C1110 58,1168 58,1254 36" class="platform" marker-end="url(#arrowGreen)"/>
    <text x="1088" y="100" class="small">platform percentage</text>
  </g>

  <g transform="translate(980 626)">
    <rect x="0" y="0" width="20" height="20" rx="5" class="tileA"/>
    <text x="30" y="16" class="tiny">Clinician A selection</text>
    <rect x="178" y="0" width="20" height="20" rx="5" class="tileB"/>
    <text x="208" y="16" class="tiny">Clinician B selection</text>
    <rect x="356" y="0" width="20" height="20" rx="5" class="tile"/>
    <text x="386" y="16" class="tiny">not selected</text>
  </g>
</svg>
